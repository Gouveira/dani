<style>
html,body{overscroll-behavior:none;background:#060716}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#0b0c2c 0%,#070818 55%,#04050f 100%);min-height:100vh;min-height:100dvh;overflow:hidden}

/* ---------- Fondo: cielo nocturno con auroras y estrellas ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:var(--o,.55);will-change:transform;transition:opacity 1.5s ease}
.a1{--o:.5;width:75vmax;height:75vmax;left:-28vmax;top:-34vmax;background:radial-gradient(circle,#4f46e5 0%,transparent 65%);animation:drift1 38s ease-in-out infinite alternate}
.a2{--o:.42;width:62vmax;height:62vmax;right:-24vmax;top:8vh;background:radial-gradient(circle,#7c3aed 0%,transparent 65%);animation:drift2 46s ease-in-out infinite alternate}
.a3{--o:.3;width:58vmax;height:58vmax;left:12vw;bottom:-36vmax;background:radial-gradient(circle,#0ea5e9 0%,transparent 65%);animation:drift3 54s ease-in-out infinite alternate}
.a4{--o:.16;width:36vmax;height:36vmax;right:4vw;bottom:-14vmax;background:radial-gradient(circle,#f472b6 0%,transparent 65%);animation:drift1 62s ease-in-out infinite alternate-reverse}
body.playing .aurora{opacity:calc(var(--o) * 1.5)}
@keyframes drift1{to{transform:translate3d(9vw,7vh,0) scale(1.12)}}
@keyframes drift2{to{transform:translate3d(-10vw,-6vh,0) scale(1.15)}}
@keyframes drift3{to{transform:translate3d(8vw,-9vh,0) scale(1.1)}}
#stars{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(3,4,15,.6) 100%)}
@media(prefers-reduced-motion:reduce){.aurora{animation:none}}
button{font-family:inherit}

/* ---------- Contador ---------- */
.bubble-card{background:rgba(255,255,255,.04);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -12px rgba(0,0,0,.5),0 0 40px -10px rgba(99,102,241,.2)}
.pulse-sec{animation:softPulse 1s infinite ease-in-out}
@keyframes softPulse{0%,100%{opacity:1}50%{opacity:.6}}
.time-unit{transition:all .3s ease-in-out}
.num{transition:font-size .6s}
#counter-wrap{position:fixed;left:50%;top:50%;width:calc(100% - 2rem);max-width:48rem;transform:translate(-50%,-50%);z-index:20;transition:top .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1),max-width .7s cubic-bezier(.4,0,.2,1)}
/* Al reproducir: el contador sube y se compacta */
body.playing #counter-wrap{top:1rem;transform:translate(-50%,0);max-width:30rem}
body.playing .bubble-card{padding:.9rem 1.25rem;border-radius:1.5rem}
body.playing .counter-title{margin-bottom:.5rem}
body.playing #counter-container{gap:.5rem 1.25rem}
body.playing .time-unit{min-width:50px}
body.playing .num{font-size:1.6rem;line-height:2rem}
body.playing .lbl{margin-top:.1rem;font-size:9px}
@media(max-width:639px){body.playing #counter-wrap{top:4.75rem}}

/* ---------- Letras (centro) ---------- */
#lyrics-stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:9rem 1.25rem;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
body.playing #lyrics-stage{opacity:1;visibility:visible;transition:opacity .7s .4s,visibility 0s}
@media(max-width:639px){#lyrics-stage{padding:12rem 1rem 9.5rem}}
.lyrics-container{width:100%;max-width:700px;overflow:visible;justify-content:center;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;text-align:center;scrollbar-width:none;transition:all .2s ease-in-out}
.lyrics-container.fading{opacity:0;transform:scale(.95)}
.lyric-line{padding:6px 0;margin:3px 0;font-size:1.4em;font-weight:600;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 20px rgba(255,255,255,.7),2px 2px 4px rgba(0,0,0,.9);line-height:1.5;opacity:0;transform:translateY(10px) scale(.95);transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;letter-spacing:.5px}
.lyric-line::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);transition:width .3s}
.lyric-line.visible{opacity:1;transform:none;animation:lyricGlow 1s ease-in-out}
.lyric-line.visible::before{width:100%}
@keyframes lyricGlow{50%{text-shadow:0 0 20px #fff,0 0 30px rgba(255,255,255,.9),0 0 40px rgba(135,206,250,.6),2px 2px 4px rgba(0,0,0,.9);transform:scale(1.05)}}
@media(max-width:768px){.lyric-line{font-size:1.2em}}
@media(max-width:480px){.lyric-line{font-size:1.1em}}
@media(max-height:560px){#lyrics-stage{padding:6.5rem 1rem 7.5rem}.lyric-line{font-size:1em;padding:2px 0;margin:2px 0}}

/* ---------- Control de reproducción (abajo) ---------- */
#player-bar{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));width:calc(100% - 2rem);max-width:30rem;padding:.9rem 1.25rem .8rem;border-radius:1.5rem;background:rgba(255,255,255,.05);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -12px rgba(0,0,0,.5);z-index:30;transform:translate(-50%,150%);opacity:0;pointer-events:none;transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .5s}
body.playing #player-bar{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.pb-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.75rem}
#bar-title{font-weight:600;letter-spacing:.05em;color:#fff}
#time-display{color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;--p:0%}

.seek::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff}
.pb-btns{display:flex;align-items:center;justify-content:center;gap:1.25rem;margin-top:.1rem}
.cbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
.cbtn:hover{background:rgba(255,255,255,.25);transform:scale(1.1)}
.cbtn svg{width:18px;height:18px;fill:currentColor}
.cbtn.main{width:52px;height:52px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-color:rgba(165,180,252,.5);box-shadow:0 6px 24px rgba(99,102,241,.45)}
.cbtn.main svg{width:22px;height:22px}

.fab.open{width:min(20rem,calc(100vw - 2rem))}

.fab.open .fab-title{opacity:1;transition-delay:.2s}
.fab-btn{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#c7d2fe;cursor:pointer;transition:color .3s,transform .45s}
.fab-btn svg{width:22px;height:22px;fill:currentColor}
.fab.open .fab-btn{color:#fff;transform:rotate(360deg)}
.fab-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.fab.open .fab-panel{grid-template-rows:1fr}
.fab-inner{min-height:0;overflow:hidden;justify-self:end;width:calc(min(20rem,100vw - 2rem) - 2px);visibility:hidden;transition:visibility 0s .45s}

.song-row{width:100%;display:flex;align-items:center;gap:.75rem;padding:.7rem .75rem;border-radius:1rem;text-align:left;color:#e2e8f0;font-weight:600;font-size:.9rem;cursor:pointer;transition:background .2s}

.song-item.current .song-name{color:#a5b4fc}
.chev{margin-left:auto;color:#94a3b8;transition:transform .3s}
.song-item.open .chev{transform:rotate(90deg)}
.song-desc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.song-item.open .song-desc{grid-template-rows:1fr}
.song-desc>div{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .35s}
.song-item.open .song-desc>div{visibility:visible;transition-delay:0s}
.song-desc p{padding:.6rem .75rem .25rem;font-size:.8rem;line-height:1.55;color:#94a3b8}
.song-play{margin:.5rem .75rem .6rem;padding:.5rem 1rem;border-radius:999px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;cursor:pointer}
.song-play svg{width:14px;height:14px;fill:currentColor}

const FECHA_INICIO = new Date("2026-10-20T17:46:00");
const $ = id => document.getElementById(id);
const unitYears = $('unit-years'), unitMonths = $('unit-months');

function calculateExactTime(s, e) {
    let years = e.getFullYear() - s.getFullYear(), months = e.getMonth() - s.getMonth(),
        days = e.getDate() - s.getDate(), hours = e.getHours() - s.getHours(),
        minutes = e.getMinutes() - s.getMinutes(), seconds = e.getSeconds() - s.getSeconds();
    if (seconds < 0) { seconds += 60; minutes--; }
    if (minutes < 0) { minutes += 60; hours--; }
    if (hours < 0) { hours += 24; days--; }
    if (days < 0) { days += new Date(e.getFullYear(), e.getMonth(), 0).getDate(); months--; }
    if (months < 0) { months += 12; years--; }
    return { years, months, days, hours, minutes, seconds };
}
const padZero = n => String(n).padStart(2, '0');

    const now = new Date();

    const d = calculateExactTime(FECHA_INICIO, now);

    const S = current.stanzas, L = current.lyrics;
    if (i < 0 || i >= S.length) return [];
    return L.slice(S[i], i + 1 < S.length ? S[i + 1] : L.length);
}
function renderStanza(i) {
    lyricsEl.innerHTML = '';
    const start = i >= 0 ? current.stanzas[i] : 0;
    stanzaLines(i).forEach((l, k) => {
        const p = document.createElement('p');
        p.className = 'lyric-line';
        p.textContent = l.text;
        p.dataset.index = start + k;
        lyricsEl.appendChild(p);
    });
}
function resetLyrics() {
    clearTimeout(renderTimer);
    lyricsEl.classList.remove('fading');
    renderStanza(0);
    stanzaIdx = 0; lastVisible = -1;
    const first = lyricsEl.querySelector('[data-index="0"]');
    if (first) { first.classList.add('visible'); lastVisible = 0; }
}
function syncLyrics() {
    const t = audio.currentTime * 1000, L = current.lyrics, S = current.stanzas;

    // Fin de la canción: 2 s después de la última línea se ocultan las letras
    if (t > L[L.length - 1].time + 2000) {
        if (!lyricsEl.classList.contains('fading')) { lyricsEl.classList.add('fading'); stanzaIdx = -1; lastVisible = -1; }
        return;
    }
    // 1. Estrofa actual
    let n = -1;
    for (let i = 0; i < S.length; i++) {
        const next = i + 1 < S.length ? L[S[i + 1]].time : Infinity;
        if (t >= L[S[i]].time && t < next) { n = i; break; }
    }
    if (n !== stanzaIdx) {
        lyricsEl.classList.add('fading');
        clearTimeout(renderTimer);
        renderTimer = setTimeout(() => { renderStanza(n); lyricsEl.classList.remove('fading'); lastVisible = -1; }, 150);
        stanzaIdx = n;
    }
    // 2. Líneas activas dentro de la estrofa
    if (stanzaIdx !== -1 && !lyricsEl.classList.contains('fading')) {
        const lines = stanzaLines(stanzaIdx);
        let latest = -1;
        for (let i = 0; i < lines.length; i++) { if (t >= lines[i].time) latest = S[stanzaIdx] + i; else break; }
        if (latest > lastVisible) {
            for (let i = lastVisible + 1; i <= latest; i++) {
                const el = lyricsEl.querySelector(`[data-index="${i}"]`);
                if (el) { el.classList.add('visible'); }
            }
            lastVisible = latest;
        } else if (latest < lastVisible) { // se retrocedió dentro de la misma estrofa
            for (let i = latest + 1; i <= lastVisible; i++) {
                const el = lyricsEl.querySelector(`[data-index="${i}"]`);
                if (el) el.classList.remove('visible');
            }
            lastVisible = latest;
        }
    }
}

// ---------- Control de reproducción ----------
function setP() { seek.style.setProperty('--p', seek.value / 10 + '%'); }
function ui() {
    const d = audio.duration, t = audio.currentTime;
    timeEl.textContent = `${fmt(t)} / ${fmt(d)}`;
    if (!dragging) { seek.value = isFinite(d) && d > 0 ? t / d * 1000 : 0; setP(); }
}
function loadSong(s) {
    current = s;
    audio.src = s.src;
    $('bar-title').textContent = s.title;
    items.forEach((li, k) => li.classList.toggle('current', SONGS[k] === s));
    resetLyrics(); ui();
}
function playSong(s) {
    if (current !== s) loadSong(s);
    document.body.classList.add('playing');
    audio.play().catch(() => {});
}

btnPlay.onclick = () => { if (current) audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
$('btn-restart').onclick = () => { if (!current) return; audio.currentTime = 0; if (audio.paused) audio.play().catch(() => {}); };
$('btn-close').onclick = () => {
    audio.pause(); audio.currentTime = 0;
    document.body.classList.remove('playing');
    ui(); setTimeout(() => { if (current && !document.body.classList.contains('playing')) resetLyrics(); }, 700);
};

seek.addEventListener('pointerdown', () => dragging = true);
['pointerup', 'pointercancel'].forEach(ev => seek.addEventListener(ev, () => dragging = false));
seek.addEventListener('input', () => { if (isFinite(audio.duration)) audio.currentTime = seek.value / 1000 * audio.duration; setP(); });

audio.addEventListener('timeupdate', () => { ui(); if (current) syncLyrics(); });
audio.addEventListener('loadedmetadata', ui);
audio.addEventListener('play', () => { btnPlay.innerHTML = ICON_PAUSE; document.body.classList.add('is-playing'); });
audio.addEventListener('pause', () => { btnPlay.innerHTML = ICON_PLAY; document.body.classList.remove('is-playing'); });
audio.addEventListener('ended', () => {
    clearTimeout(renderTimer);
    lyricsEl.classList.add('fading'); stanzaIdx = -1; lastVisible = -1;
    btnPlay.innerHTML = ICON_PLAY;
});
audio.addEventListener('error', () => {
    if (!current) return;
    clearTimeout(renderTimer);
    lyricsEl.classList.remove('fading'); lyricsEl.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'lyric-line visible';
    p.textContent = `No se encontró el audio «${current.src}». Ponlo en la misma carpeta que este archivo.`;
    lyricsEl.appendChild(p);
});

// ---------- Menú de canciones ----------
const items = [];
SONGS.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'song-item';
    li.innerHTML = `<button class="song-row" aria-expanded="false"><span class="song-n">${i + 1}</span><span class="song-name">${s.title}</span><span class="chev">›</span></button>
      <div class="song-desc"><div><p>${s.description}</p><button class="song-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Reproducir</button></div></div>`;
    const row = li.querySelector('.song-row');
    row.onclick = () => {
        const wasOpen = li.classList.contains('open');
        items.forEach(x => { x.classList.remove('open'); x.querySelector('.song-row').setAttribute('aria-expanded', 'false'); });
        if (!wasOpen) { li.classList.add('open'); row.setAttribute('aria-expanded', 'true'); }
    };
    li.querySelector('.song-play').onclick = () => { setMenu(false); playSong(s); };
    items.push(li);
    $('song-list').appendChild(li);
});

function setMenu(open) { fab.classList.toggle('open', open); fabBtn.setAttribute('aria-expanded', open); }
fabBtn.onclick = () => setMenu(!fab.classList.contains('open'));
document.addEventListener('click', e => { if (!fab.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

// ---------- Bloqueo de scroll mientras se muestran las letras ----------
// Se permite solo sobre la barra de reproducción (para arrastrar el seek) y el menú ♪.
const lockScroll = e => {
    if (document.body.classList.contains('playing') && !e.target.closest('#player-bar, #fab')) e.preventDefault();
};
document.addEventListener('wheel', lockScroll, { passive: false });
document.addEventListener('touchmove', lockScroll, { passive: false });
document.addEventListener('keydown', e => {
    if (document.body.classList.contains('playing') && [' ', 'PageUp', 'PageDown', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)
        && !e.target.closest('#player-bar, #fab')) e.preventDefault();
});

// ---------- Fondo: estrellas titilantes y alguna estrella fugaz ----------
(function () {
    const cv = $('stars'), cx = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, stars = [], shoot = null, nextShoot = 4000;
    function size() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = Array.from({ length: Math.min(260, Math.round(W * H / 7000)) }, () => ({
            x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .3,
            a: Math.random() * .5 + .35, f: Math.random() * 1.5 + .5, p: Math.random() * 6.28,
            v: Math.random() * .03 + .008, c: Math.random() < .2 ? '165,200,255' : '255,255,255'
        }));
    }
    function frame(t) {
        cx.clearRect(0, 0, W, H);
        for (const s of stars) {
            if (!still) { s.y -= s.v; if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; } }
            const tw = still ? 1 : .6 + .4 * Math.sin(t / 1000 * s.f + s.p);
            cx.fillStyle = `rgba(${s.c},${s.a * tw})`;
            cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
        }
        if (!still) {
            if (!shoot && t > nextShoot) shoot = { x: W * (.3 + Math.random() * .6), y: H * Math.random() * .35, t0: t };
            if (shoot) {
                const k = (t - shoot.t0) / 900;
                if (k >= 1) { shoot = null; nextShoot = t + 9000 + Math.random() * 9000; }
                else {
                    const x = shoot.x - k * 340, y = shoot.y + k * 170, g = cx.createLinearGradient(x, y, x + 100, y - 50);
                    g.addColorStop(0, `rgba(255,255,255,${Math.sin(k * Math.PI)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
                    cx.strokeStyle = g; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + 100, y - 50); cx.stroke();
                }
            }
            requestAnimationFrame(frame);
        }
    }
    size();
    addEventListener('resize', () => { size(); if (still) frame(0); });
    still ? frame(0) : requestAnimationFrame(frame);
})();
</script>
</body>
</html>
